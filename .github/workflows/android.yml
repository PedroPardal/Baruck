name: Build Baruck APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Restaurar google-services.json
        env: { GOOGLE_SERVICES_JSON: '${{ secrets.GOOGLE_SERVICES_JSON }}' }
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::error::Falta o secret GOOGLE_SERVICES_JSON."; exit 1
          fi

      - name: Restaurar keystore
        env: { KEYSTORE_B64: '${{ secrets.KEYSTORE_B64 }}' }
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > keystore/baruck-debug.jks
            echo "Keystore do secret (SHA-1 bate com o Firebase)."
          else
            keytool -genkeypair -v -keystore keystore/baruck-debug.jks \
              -storepass baruck123 -keypass baruck123 -alias baruck \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Baruck Debug, O=Baruck, C=BR"
            echo "::warning::Keystore nova gerada."
          fi

      - name: Preparar Android SDK (aceitar licencas)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK em: $SDK"
          mkdir -p "$SDK/licenses"
          printf '%s\n%s\n%s\n' \
            8933bad161af4178b1185d1a37fbf41ea5269c55 \
            d56f5187479451eabf01fb78af6dfcb131a6481e \
            24333f8a63b6825ea9c5514f83c2829b004d1fee \
            > "$SDK/licenses/android-sdk-license"
          SDKMGR="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -n "$SDKMGR" ]; then yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true; fi

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baruck-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar APK como release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Baruck.apk
          NOTES="$(git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed '/^$/N;/^\n$/D')"
          jq -n --argjson c ${{ github.run_number }} --arg n "$NOTES" \
            '{versionCode: $c, versionName: ("2.0." + ($c|tostring)), notes: $n}' > version.json
          cat version.json
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Baruck.apk version.json \
            --title "Baruck 2.0.${{ github.run_number }}" \
            --notes "$NOTES" \
            --latest
